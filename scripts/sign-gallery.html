<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>V2.1 Sign Asset Gallery</title>
  <style>
    body { margin: 0; padding: 24px; color: #0f172a; background: #f8fafc; font: 14px/1.4 system-ui, sans-serif; }
    h1 { margin: 0 0 8px; }
    p { margin: 0 0 24px; color: #64748b; }
    main { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
    article { padding: 14px; border: 1px solid #dbe4f0; border-radius: 14px; background: white; }
    img { display: block; width: 100%; height: 145px; object-fit: contain; }
    strong, small { display: block; }
    small { margin-top: 4px; color: #64748b; }
  </style>
</head>
<body>
  <h1>V2.1 Road Sign Assets</h1>
  <p>Original study reconstructions based on FHWA/MUTCD conventions; not fabrication drawings.</p>
  <main id="gallery"></main>
  <script src="../data/knowledge/signs.js"></script>
  <script>
    document.querySelector("#gallery").innerHTML = window.DMV_SIGN_KNOWLEDGE.map((sign) => `
      <article>
        <img src="../${sign.image}?v=2.1.1" alt="${sign.imageAlt}" />
        <strong>${sign.name.en}</strong>
        <small>${sign.designation} · ${sign.category}</small>
      </article>
    `).join("");
  </script>
</body>
</html>
