<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-labelledby="title desc">
  <title id="title">EXIT SPEED (W13-2P)</title>
  <desc id="desc">Original study reconstruction of the EXIT SPEED traffic sign, based on FHWA MUTCD conventions. Not a fabrication drawing.</desc>
  <rect width="200" height="200" rx="16" fill="#f8fafc"/>
  <rect x="20" y="20" width="160" height="160" rx="10" fill="#facc15" stroke="#ffffff" stroke-width="5"/>
  <text x="100" y="61.0" text-anchor="middle" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="800">EXIT</text><text x="100" y="126.0" text-anchor="middle" fill="#111827" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800">25 MPH</text>
</svg>
